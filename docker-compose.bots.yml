services:
  # =========================================================
  # Phase D: Execution ownership cutover
  # - paper/live/pump: nautilus engines (single consumer per role)
  # =========================================================

  nautilus_paper_engine:
    build:
      context: ./services/nautilus_engine
      dockerfile: Dockerfile
    command: python -m nautilus_engine.main
    restart: unless-stopped
    environment:
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      ROLE: paper
      DB_SCHEMA: mina_paper
      EXECUTION_MODE: SIM
      NAUTILUS_POLL_SEC: "2"
      ENGINE_ID: nautilus_paper_engine
      LIVE_EXECUTION_ALLOWED: "0"
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started

  nautilus_live_engine:
    build:
      context: ./services/nautilus_engine
      dockerfile: Dockerfile
    command: python -m nautilus_engine.main
    restart: unless-stopped
    environment:
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      ROLE: live
      DB_SCHEMA: mina_live
      EXECUTION_MODE: SIM_OR_TESTNET
      NAUTILUS_POLL_SEC: "2"
      ENGINE_ID: nautilus_live_engine
      LIVE_EXECUTION_ALLOWED: ${LIVE_EXECUTION_ALLOWED:-0}
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started

  nautilus_pump_engine:
    build:
      context: ./services/nautilus_engine
      dockerfile: Dockerfile
    command: python -m nautilus_engine.main
    restart: unless-stopped
    environment:
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      ROLE: pump
      DB_SCHEMA: mina_pump
      EXECUTION_MODE: SIM
      NAUTILUS_POLL_SEC: "2"
      ENGINE_ID: nautilus_pump_engine
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started

  # Optional strategy publisher (signal generation only; no execution).
  mina_strategies:
    profiles: ["phaseb"]
    build:
      context: ./services/mina_strategies
      dockerfile: Dockerfile
    command: python -m mina_strategies.main
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: http://gateway_api:8200
      ROLE_TARGETS: ${MINA_STRATEGIES_ROLE_TARGETS:-paper}
      MINA_STRATEGIES_SYMBOLS: BTCUSDT,ETHUSDT
      MINA_STRATEGIES_INTERVAL_SEC: "30"
      MINA_STRATEGIES_DRY_RUN: "0"
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      gateway_api:
        condition: service_started
