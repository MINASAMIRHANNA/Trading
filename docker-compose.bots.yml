services:
  # =========================================================
  # Phase 3: Mina bots + monitors (Postgres PRIMARY)
  # Start with:
  #   docker compose -f docker-compose.yml -f docker-compose.bots.yml up -d --build
  # =========================================================

  mina_paper_monitor:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: python execution_monitor.py
    restart: unless-stopped
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      TRADING_PG_SCHEMA: mina_paper
      BOT_ROLE: paper
      BOT_ID: paper-1
      BOT_VERSION: 1.0.0
      DASHBOARD_URL: http://gateway_api:8200
      DASHBOARD_PUBLISH_URL: http://gateway_api:8200/api/unified/paper/publish
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app

  mina_paper_bot:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: python services/paper_bot/main.py
    restart: unless-stopped
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      TRADING_PG_SCHEMA: mina_paper
      BOT_ROLE: paper
      BOT_ID: paper-1
      BOT_VERSION: 1.0.0
      DASHBOARD_URL: http://gateway_api:8200
      DASHBOARD_PUBLISH_URL: http://gateway_api:8200/api/unified/paper/publish
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app

  mina_live_monitor:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: python execution_monitor.py
    restart: unless-stopped
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      TRADING_PG_SCHEMA: mina_live
      BOT_ROLE: live
      BOT_ID: live-1
      BOT_VERSION: 1.0.0
      DASHBOARD_URL: http://gateway_api:8200
      DASHBOARD_PUBLISH_URL: http://gateway_api:8200/api/unified/live/publish
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app

  mina_live_bot:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: python services/live_bot/main.py
    restart: unless-stopped
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      TRADING_PG_SCHEMA: mina_live
      BOT_ROLE: live
      BOT_ID: live-1
      BOT_VERSION: 1.0.0
      DASHBOARD_URL: http://gateway_api:8200
      DASHBOARD_PUBLISH_URL: http://gateway_api:8200/api/unified/live/publish
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app

  mina_pump_bot:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: python pump_hunter.py
    restart: unless-stopped
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      TRADING_PG_SCHEMA: mina_pump
      BOT_ROLE: pump
      BOT_ID: pump-1
      BOT_VERSION: 1.0.0
      DASHBOARD_URL: http://gateway_api:8200
      DASHBOARD_PUBLISH_URL: http://gateway_api:8200/api/unified/pump/publish
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app

  # =========================================================
  # Phase B skeleton services (optional profile)
  # Start with profile:
  #   docker compose -f docker-compose.yml -f docker-compose.bots.yml --profile phaseb up -d --build
  # =========================================================

  nautilus_engine:
    profiles: ["phaseb"]
    build:
      context: ./services/nautilus_engine
      dockerfile: Dockerfile
    command: python -m nautilus_engine.main
    restart: unless-stopped
    environment:
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      NAUTILUS_ROLES: paper
      NAUTILUS_POLL_SEC: "2"
      NAUTILUS_MODE: PAPER
      ENGINE_ID: nautilus_engine
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy

  mina_strategies:
    profiles: ["phaseb"]
    build:
      context: ./services/mina_strategies
      dockerfile: Dockerfile
    command: python -m mina_strategies.main
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: http://gateway_api:8200
      MINA_STRATEGIES_ROLES: paper
      MINA_STRATEGIES_SYMBOLS: BTCUSDT,ETHUSDT
      MINA_STRATEGIES_INTERVAL_SEC: "30"
      MINA_STRATEGIES_DRY_RUN: "0"
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      gateway_api:
        condition: service_started
