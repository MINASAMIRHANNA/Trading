services:
  # =========================================================
  # Phase C: Execution ownership cutover
  # - paper/live: nautilus engines (single consumer per role)
  # - pump: legacy mina bot + monitor
  # =========================================================

  nautilus_paper_engine:
    build:
      context: ./services/nautilus_engine
      dockerfile: Dockerfile
    command: python -m nautilus_engine.main
    restart: unless-stopped
    environment:
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      ROLE: paper
      DB_SCHEMA: mina_paper
      EXECUTION_MODE: SIM
      NAUTILUS_POLL_SEC: "2"
      ENGINE_ID: nautilus_paper_engine
      LIVE_EXECUTION_ALLOWED: "0"
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started

  nautilus_live_engine:
    build:
      context: ./services/nautilus_engine
      dockerfile: Dockerfile
    command: python -m nautilus_engine.main
    restart: unless-stopped
    environment:
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      ROLE: live
      DB_SCHEMA: mina_live
      EXECUTION_MODE: SIM_OR_TESTNET
      NAUTILUS_POLL_SEC: "2"
      ENGINE_ID: nautilus_live_engine
      LIVE_EXECUTION_ALLOWED: ${LIVE_EXECUTION_ALLOWED:-0}
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started

  # Pump role remains legacy for now.
  mina_pump_bot:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: python pump_hunter.py
    restart: unless-stopped
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      TRADING_PG_SCHEMA: mina_pump
      BOT_ROLE: pump
      BOT_ID: pump-1
      BOT_VERSION: 1.0.0
      DASHBOARD_URL: http://gateway_api:8200
      DASHBOARD_PUBLISH_URL: http://gateway_api:8200/api/unified/pump/publish
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app

  mina_pump_monitor:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: python execution_monitor.py
    restart: unless-stopped
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      TRADING_PG_SCHEMA: mina_pump
      BOT_ROLE: pump
      BOT_ID: pump-1
      BOT_VERSION: 1.0.0
      DASHBOARD_URL: http://gateway_api:8200
      DASHBOARD_PUBLISH_URL: http://gateway_api:8200/api/unified/pump/publish
    depends_on:
      postgres:
        condition: service_healthy
      gateway_api:
        condition: service_started
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app

  # Optional strategy publisher (signal generation only; no execution).
  mina_strategies:
    profiles: ["phaseb"]
    build:
      context: ./services/mina_strategies
      dockerfile: Dockerfile
    command: python -m mina_strategies.main
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: http://gateway_api:8200
      ROLE_TARGETS: ${MINA_STRATEGIES_ROLE_TARGETS:-paper}
      MINA_STRATEGIES_SYMBOLS: BTCUSDT,ETHUSDT
      MINA_STRATEGIES_INTERVAL_SEC: "30"
      MINA_STRATEGIES_DRY_RUN: "0"
      SIGNAL_SCHEMA_VERSION: v1
    depends_on:
      gateway_api:
        condition: service_started
