services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/schema.sql:/docker-entrypoint-initdb.d/01_shared_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 20

  brain_api:
    build:
      context: ./services/brain
      dockerfile: Dockerfile
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8100
    environment:
      DATABASE_URL: ${BRAIN_DATABASE_URL:-postgresql+psycopg://trading:trading@postgres:5432/trading}
      PG_SCHEMA: ${BRAIN_PG_SCHEMA:-brain}
      TRADING_PG_DSN: ${TRADING_PG_DSN:-postgresql+psycopg://trading:trading@postgres:5432/trading}
      MINA_TRADING_PG_DSN: ${MINA_TRADING_PG_DSN:-postgresql+psycopg://trading:trading@postgres:5432/trading}
      GATEWAY_API_URL: http://gateway_api:8200
    volumes:
      - ./services/brain:/app
      - brain_data:/data
    working_dir: /app
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 15


  brain_sync_worker:
    profiles: ["sync"]
    build:
      context: ./services/brain_sync_worker
      dockerfile: Dockerfile
    depends_on:
      - brain_api
    environment:
      - BRAIN_API_URL=http://brain_api:8100
      - ROLES=paper,live,pump
      - INTERVAL_SEC=60
      - STARTUP_SLEEP_SEC=10

  brain_ui:
    build:
      context: ./services/brain/dashboard
      dockerfile: Dockerfile
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      VITE_PROXY_TARGET: http://gateway_api:8200
      VITE_API_KEY: ${GATEWAY_API_KEY:-}
    volumes:
      - ./services/brain/dashboard:/app
      - brain_ui_node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - brain_api
      - gateway_api

  gateway_api:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m uvicorn gateway_api.main:app --host 0.0.0.0 --port 8200
    environment:
      - BRAIN_API_URL=http://brain_api:8100
      - DASHBOARD_API_KEY=trading-dev
      - TRADING_PG_DSN=postgresql://trading:trading@postgres:5432/trading
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - GATEWAY_COOKIE_SECRET=${GATEWAY_COOKIE_SECRET:-trading-dev-cookie-secret}
      - GATEWAY_AUTH_COOKIE=${GATEWAY_AUTH_COOKIE:-gateway_session}
      - GATEWAY_COOKIE_TTL_S=${GATEWAY_COOKIE_TTL_S:-604800}
      - GATEWAY_COOKIE_SECURE=${GATEWAY_COOKIE_SECURE:-0}
      - GATEWAY_COOKIE_SAMESITE=${GATEWAY_COOKIE_SAMESITE:-lax}
      - GATEWAY_CORS_ORIGINS=${GATEWAY_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8200:8200"

    depends_on:
      postgres:
        condition: service_healthy
      brain_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 15

  gateway_autopilot_worker:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m gateway_api.autopilot_worker
    environment:
      - GATEWAY_URL=http://gateway_api:8200
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - AUTOPILOT_TICK_SEC=10
      - AUTOPILOT_MAX_SIGNALS_PER_ROLE=50
      - AUTOPILOT_ROLES=paper,live,pump
    depends_on:
      - gateway_api

  gateway_alerts_worker:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m gateway_api.alerts_worker
    environment:
      - TRADING_PG_DSN=postgresql://trading:trading@postgres:5432/trading
      - TRADING_MASTER_KEY=${TRADING_MASTER_KEY:-}
      - ALERTS_TICK_SEC=5
    depends_on:
      - gateway_api
volumes:
  pgdata:
  brain_data:
  brain_ui_node_modules:

networks:
  default:
    name: trading_net
