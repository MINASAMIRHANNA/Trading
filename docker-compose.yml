services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/schema.sql:/docker-entrypoint-initdb.d/01_shared_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Mina dashboards only (safe). Bots/monitors are in docker-compose.bots.yml
  mina_dashboard_paper:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8000
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      # Phase 4: mirror runtime events/logs/settings into shared_* tables (public schema)
      # so Gateway/Brain can consume a unified stream. Set to 0 to disable.
      TRADING_PG_MIRROR: "1"
      BOT_ROLE: paper
      BOT_ID: paper-1
      BOT_VERSION: 1.0.0
      DASHBOARD_API_KEY: trading-dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app
    ports:
      - "8000:8000"

  mina_dashboard_live:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8001
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      BOT_ROLE: live
      BOT_ID: live-1
      BOT_VERSION: 1.0.0
      DASHBOARD_API_KEY: trading-dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app
    ports:
      - "8001:8001"

  mina_dashboard_pump:
    build:
      context: ./services/mina_bot
      dockerfile: Dockerfile
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8002
    environment:
      MINA_DB_BACKEND: postgres
      TRADING_PG_DSN: postgresql://trading:trading@postgres:5432/trading
      TRADING_PG_MIRROR: "1"
      BOT_ROLE: pump
      BOT_ID: pump-1
      BOT_VERSION: 1.0.0
      DASHBOARD_API_KEY: trading-dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/mina_bot:/app
    working_dir: /app
    ports:
      - "8002:8002"

  brain_api:
    build:
      context: ./services/brain
      dockerfile: Dockerfile
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8100
    environment:
      DATABASE_URL: ${BRAIN_DATABASE_URL:-postgresql+psycopg://trading:trading@postgres:5432/trading}
      PG_SCHEMA: ${BRAIN_PG_SCHEMA:-brain}
      TRADING_PG_DSN: ${TRADING_PG_DSN:-postgresql+psycopg://trading:trading@postgres:5432/trading}
      MINA_TRADING_PG_DSN: ${MINA_TRADING_PG_DSN:-postgresql+psycopg://trading:trading@postgres:5432/trading}
      GATEWAY_API_URL: http://gateway_api:8200
    volumes:
      - ./services/brain:/app
      - brain_data:/data
    working_dir: /app
    ports:
      - "8100:8100"


  brain_sync_worker:
    profiles: ["sync"]
    build:
      context: ./services/brain_sync_worker
      dockerfile: Dockerfile
    depends_on:
      - brain_api
    environment:
      - BRAIN_API_URL=http://brain_api:8100
      - ROLES=paper,live,pump
      - INTERVAL_SEC=60
      - STARTUP_SLEEP_SEC=10

  brain_ui:
    profiles: ["dev"]
    build:
      context: ./services/brain/dashboard
      dockerfile: Dockerfile
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      VITE_PROXY_TARGET: http://gateway_api:8200
      VITE_API_KEY: ${GATEWAY_API_KEY:-}
    volumes:
      - ./services/brain/dashboard:/app
      - brain_ui_node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - brain_api
      - gateway_api

  gateway_api:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m uvicorn gateway_api.main:app --host 0.0.0.0 --port 8200
    environment:
      - BRAIN_API_URL=http://brain_api:8100
      - DASHBOARD_API_KEY=trading-dev
      - MINA_PAPER_URL=http://mina_dashboard_paper:8000
      - MINA_LIVE_URL=http://mina_dashboard_live:8001
      - MINA_PUMP_URL=http://mina_dashboard_pump:8002
      - TRADING_PG_DSN=postgresql://trading:trading@postgres:5432/trading
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - GATEWAY_COOKIE_SECRET=${GATEWAY_COOKIE_SECRET:-trading-dev-cookie-secret}
      - GATEWAY_AUTH_COOKIE=${GATEWAY_AUTH_COOKIE:-gateway_session}
      - GATEWAY_COOKIE_TTL_S=${GATEWAY_COOKIE_TTL_S:-604800}
      - GATEWAY_COOKIE_SECURE=${GATEWAY_COOKIE_SECURE:-0}
      - GATEWAY_COOKIE_SAMESITE=${GATEWAY_COOKIE_SAMESITE:-lax}
      - GATEWAY_CORS_ORIGINS=${GATEWAY_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8200:8200"

    depends_on:
      postgres:
        condition: service_healthy

  gateway_autopilot_worker:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m gateway_api.autopilot_worker
    environment:
      - GATEWAY_URL=http://gateway_api:8200
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - AUTOPILOT_TICK_SEC=10
      - AUTOPILOT_MAX_SIGNALS_PER_ROLE=50
      - AUTOPILOT_ROLES=paper,live,pump
    depends_on:
      - gateway_api
volumes:
  pgdata:
  brain_data:
  brain_ui_node_modules:

networks:
  default:
    name: trading_net
